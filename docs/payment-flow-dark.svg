<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 1066" width="1110" height="1066" role="img" aria-label="Sequence diagram of a private x402 payment on Aleo with prepaid credits: the agent's first signed call gets a 402; it authorizes a private USDCx transfer, gets the network fee sponsored by sending only the public transition, proves the payment, and retries; the server verifies, settles on Aleo and credits the agent's identity address; later signed calls spend credits in milliseconds.">
<style>
  .bg { fill: #0d1117; }
  .band { fill: #151b23; }
  .lifeline { stroke: #3d444d; stroke-width: 1.2; }
  .box { fill: #0d1117; stroke: #3d444d; stroke-width: 1.2; }
  .box-strong { fill: #0d1117; stroke: #e6edf3; stroke-width: 1.8; }
  .bracket { fill: none; stroke: #656c76; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .msg { stroke: #e6edf3; stroke-width: 1.4; fill: none; }
  .ret { stroke: #e6edf3; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  .head { fill: #e6edf3; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .t { fill: #e6edf3; font-size: 13px; }
  .name { fill: #e6edf3; font-size: 15px; font-weight: 600; }
  .phase { fill: #e6edf3; font-size: 14px; font-weight: 600; }
  .sub { fill: #9198a1; font-size: 12px; }
  .code { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .acc { fill: #4cc9b4; font-size: 12.5px; font-weight: 600; }
  .strong { fill: #e6edf3; font-size: 14px; font-weight: 600; }
  .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 6px; stroke-linejoin: round; }
  .band-halo { paint-order: stroke; stroke: #151b23; stroke-width: 6px; stroke-linejoin: round; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1110" height="1066"/>

<!-- phase bands -->
<rect class="band" x="0" y="104" width="1110" height="146"/>
<rect class="band" x="0" y="566" width="1110" height="286"/>

<!-- server and facilitator share one process -->
<rect class="bracket" x="432" y="6" width="466" height="90" rx="10"/>
<text class="sub" x="665" y="23" text-anchor="middle">same process</text>

<!-- participants -->
<rect class="box" x="170" y="34" width="200" height="52" rx="6"/>
<text class="name" x="270" y="55.5" text-anchor="middle">Agent</text>
<text class="sub" x="270" y="72.5" text-anchor="middle">payment + identity accounts</text>
<rect class="box" x="445" y="34" width="190" height="52" rx="6"/>
<text class="name" x="540" y="55.5" text-anchor="middle">API server</text>
<text class="sub" x="540" y="72.5" text-anchor="middle">credits ledger</text>
<rect class="box" x="685" y="34" width="190" height="52" rx="6"/>
<text class="name" x="780" y="55.5" text-anchor="middle">Facilitator</text>
<text class="sub" x="780" y="72.5" text-anchor="middle">seller view key · fee account</text>
<rect class="box" x="905" y="34" width="190" height="52" rx="6"/>
<text class="name" x="1000" y="55.5" text-anchor="middle">Aleo mainnet</text>
<text class="sub" x="1000" y="72.5" text-anchor="middle">USDCx</text>
<line class="lifeline" x1="270" y1="86" x2="270" y2="1000"/>
<line class="lifeline" x1="1000" y1="86" x2="1000" y2="1000"/>
<line class="lifeline" x1="540" y1="96" x2="540" y2="1000"/>
<line class="lifeline" x1="780" y1="96" x2="780" y2="1000"/>

<!-- 1 first call -->
<text class="phase" x="20" y="172" text-anchor="start">First call</text>
<text class="sub" x="20" y="190" text-anchor="start">no credits yet</text>
<line class="msg" x1="270" y1="140" x2="538" y2="140" marker-end="url(#arrow)"/>
<text class="code band-halo" x="405" y="133" text-anchor="middle">GET /resource</text>
<text class="acc band-halo" x="405" y="157" text-anchor="middle">signed by identity account</text>
<rect class="box" x="435" y="172" width="210" height="32" rx="6"/>
<text class="t" x="540" y="192" text-anchor="middle">signature ok · 0 credits</text>
<line class="ret" x1="540" y1="232" x2="272" y2="232" marker-end="url(#arrow)"/>
<text class="t band-halo" x="405" y="225" text-anchor="middle">402 · top-up price + fee URL</text>

<!-- 2 pay privately -->
<text class="phase" x="20" y="400" text-anchor="start">Pay privately</text>
<text class="sub" x="20" y="418" text-anchor="start">once per top-up</text>
<line class="msg" x1="270" y1="280" x2="998" y2="280" marker-end="url(#arrow)"/>
<text class="t halo" x="660" y="273" text-anchor="middle">read USDCx freeze list</text>
<rect class="box" x="165" y="294" width="210" height="44" rx="6"/>
<text class="t" x="270" y="311.5" text-anchor="middle">authorize + sign transfer</text>
<text class="sub" x="270" y="328.5" text-anchor="middle">no proof yet · ~3 s</text>
<line class="msg" x1="270" y1="372" x2="778" y2="372" marker-end="url(#arrow)"/>
<text class="code halo" x="405" y="365" text-anchor="middle">POST /aleo/fee-authorization</text>
<text class="sub halo" x="405" y="389" text-anchor="middle">public transition only</text>
<rect class="box" x="655" y="402" width="250" height="66" rx="6"/>
<text class="acc" x="780" y="422" text-anchor="middle">decrypt with seller view key</text>
<text class="t" x="780" y="439" text-anchor="middle">check amount, unspent, root</text>
<text class="t" x="780" y="456" text-anchor="middle">sign fee for this payment</text>
<line class="ret" x1="780" y1="492" x2="272" y2="492" marker-end="url(#arrow)"/>
<text class="t halo" x="525" y="485" text-anchor="middle">signed fee authorization</text>
<rect class="box-strong" x="165" y="508" width="210" height="44" rx="6"/>
<text class="strong" x="270" y="525.5" text-anchor="middle">prove transfer + fee</text>
<text class="sub" x="270" y="542.5" text-anchor="middle">~50 s on 10 cores</text>

<!-- 3 settle and credit -->
<text class="phase" x="20" y="704" text-anchor="start">Settle</text>
<text class="sub" x="20" y="722" text-anchor="start">credits added</text>
<line class="msg" x1="270" y1="598" x2="538" y2="598" marker-end="url(#arrow)"/>
<text class="code band-halo" x="405" y="591" text-anchor="middle">GET /resource + PAYMENT-SIGNATURE</text>
<text class="acc band-halo" x="405" y="615" text-anchor="middle">signed by identity account</text>
<line class="msg" x1="540" y1="638" x2="778" y2="638" marker-end="url(#arrow)"/>
<text class="t band-halo" x="660" y="631" text-anchor="middle">verify</text>
<line class="ret" x1="780" y1="660" x2="542" y2="660" marker-end="url(#arrow)"/>
<text class="t band-halo" x="660" y="653" text-anchor="middle">valid</text>
<rect class="box" x="440" y="674" width="200" height="30" rx="6"/>
<text class="t" x="540" y="693" text-anchor="middle">run handler, hold response</text>
<line class="msg" x1="540" y1="728" x2="778" y2="728" marker-end="url(#arrow)"/>
<text class="t band-halo" x="660" y="721" text-anchor="middle">settle</text>
<line class="msg" x1="780" y1="748" x2="998" y2="748" marker-end="url(#arrow)"/>
<text class="t band-halo" x="890" y="741" text-anchor="middle">broadcast</text>
<line class="ret" x1="1000" y1="770" x2="782" y2="770" marker-end="url(#arrow)"/>
<text class="t band-halo" x="890" y="763" text-anchor="middle">accepted · ~3 s</text>
<rect class="box" x="435" y="784" width="210" height="30" rx="6"/>
<text class="t" x="540" y="803" text-anchor="middle">credit identity address</text>
<line class="ret" x1="540" y1="836" x2="272" y2="836" marker-end="url(#arrow)"/>
<text class="t band-halo" x="405" y="829" text-anchor="middle">200 · response · credits left</text>

<!-- 4 later calls -->
<text class="phase" x="20" y="916" text-anchor="start">Later calls</text>
<text class="sub" x="20" y="934" text-anchor="start">until credits run out</text>
<line class="msg" x1="270" y1="888" x2="538" y2="888" marker-end="url(#arrow)"/>
<text class="code halo" x="405" y="881" text-anchor="middle">GET /resource</text>
<text class="acc halo" x="405" y="905" text-anchor="middle">signed by identity account</text>
<rect class="box" x="425" y="918" width="230" height="32" rx="6"/>
<text class="t" x="540" y="938" text-anchor="middle">check signature · spend 1 credit</text>
<line class="ret" x1="540" y1="978" x2="272" y2="978" marker-end="url(#arrow)"/>
<text class="t halo" x="405" y="971" text-anchor="middle">200 · response · milliseconds</text>

<!-- legend -->
<text class="sub" x="20" y="1030" text-anchor="start">Solid arrows are requests, dashed arrows replies.</text>
<text class="sub" x="20" y="1048" text-anchor="start">Green marks what keeps the agent private: its identity account signs requests, and the facilitator reads payments with the seller's view key.</text>
</svg>
